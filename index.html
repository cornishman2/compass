<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Compass</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        #heading {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }
        
        #direction {
            font-size: 24px;
            color: #666;
            margin: 20px 0;
            font-weight: 500;
        }
        
        #debug {
            font-size: 11px;
            color: #999;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            text-align: left;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .status-waiting {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        
        button:active {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Compass</h1>
        <div id="heading">---</div>
        <div id="direction">---</div>
        <div id="debug"></div>
        <div id="status" class="status-waiting">Initializing compass...</div>
        <button id="requestBtn" style="display:none;">Enable Compass</button>
    </div>

    <script>
        const headingEl = document.getElementById('heading');
        const directionEl = document.getElementById('direction');
        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const requestBtn = document.getElementById('requestBtn');
        
        let isActive = false;

        function getDirection(heading) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const index = Math.round(heading / 45) % 8;
            return directions[index];
        }

        function compassHeading(alpha, beta, gamma, absolute) {
            // For phone held flat (beta near 0), use alpha directly if absolute
            if (absolute && Math.abs(beta) < 30) {
                return alpha;
            }
            
            // For relative orientation, invert alpha (it decreases clockwise)
            if (!absolute) {
                let heading = 360 - alpha;
                if (heading >= 360) heading -= 360;
                return heading;
            }
            
            // If not flat or not absolute, try 3D calculation
            const alphaRad = alpha * (Math.PI / 180);
            const betaRad = beta * (Math.PI / 180);
            const gammaRad = gamma * (Math.PI / 180);

            const cA = Math.cos(alphaRad);
            const sA = Math.sin(alphaRad);
            const sB = Math.sin(betaRad);
            const cG = Math.cos(gammaRad);
            const sG = Math.sin(gammaRad);

            const rA = -cA * sG - sA * sB * cG;
            const rB = -sA * sG + cA * sB * cG;

            let heading = Math.atan2(rA, rB) * (180 / Math.PI);
            
            if (heading < 0) {
                heading += 360;
            }

            return heading;
        }

        function handleOrientationAbsolute(e) {
            if (e.alpha === null || e.beta === null || e.gamma === null) return;
            
            const heading = compassHeading(e.alpha, e.beta, e.gamma, e.absolute);
            
            debugEl.innerHTML = `
                Event: deviceorientationabsolute<br>
                absolute: ${e.absolute}<br>
                alpha: ${e.alpha.toFixed(1)}°<br>
                beta: ${e.beta.toFixed(1)}°<br>
                gamma: ${e.gamma.toFixed(1)}°<br>
                ---<br>
                Calculated heading: ${heading.toFixed(1)}°<br>
                Method: ${e.absolute && Math.abs(e.beta) < 30 ? 'Direct alpha' : (e.absolute ? '3D calc' : 'Inverted')}
            `;
            
            headingEl.textContent = Math.round(heading) + '°';
            directionEl.textContent = getDirection(heading);
            
            if (!isActive) {
                isActive = true;
                statusEl.textContent = 'Compass active (Absolute)';
                statusEl.className = 'status-active';
            }
        }

        function handleOrientation(e) {
            if (e.alpha === null || e.beta === null || e.gamma === null) return;
            
            const heading = compassHeading(e.alpha, e.beta, e.gamma, e.absolute);
            
            debugEl.innerHTML = `
                Event: deviceorientation<br>
                absolute: ${e.absolute}<br>
                alpha: ${e.alpha.toFixed(1)}°<br>
                beta: ${e.beta.toFixed(1)}°<br>
                gamma: ${e.gamma.toFixed(1)}°<br>
                webkitHeading: ${e.webkitCompassHeading !== undefined ? e.webkitCompassHeading.toFixed(1) : 'N/A'}<br>
                ---<br>
                Calculated heading: ${heading.toFixed(1)}°<br>
                Method: ${e.absolute && Math.abs(e.beta) < 30 ? 'Direct alpha' : (e.absolute ? '3D calc' : 'Inverted')}
            `;
            
            // Prefer webkitCompassHeading if available
            let finalHeading = heading;
            if (e.webkitCompassHeading !== undefined) {
                finalHeading = e.webkitCompassHeading;
            }
            
            headingEl.textContent = Math.round(finalHeading) + '°';
            directionEl.textContent = getDirection(finalHeading);
            
            if (!isActive) {
                isActive = true;
                statusEl.textContent = e.webkitCompassHeading !== undefined ? 
                    'Compass active (iOS)' : 'Compass active (Calculated)';
                statusEl.className = 'status-active';
            }
        }

        function initCompass() {
            debugEl.innerHTML = 'Checking for sensors...<br>';
            
            if (typeof DeviceOrientationEvent === 'undefined') {
                statusEl.textContent = 'Device orientation not supported';
                statusEl.className = 'status-error';
                return;
            }
            
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                requestBtn.style.display = 'block';
                statusEl.textContent = 'Permission required - tap button below';
                statusEl.className = 'status-waiting';
                
                requestBtn.addEventListener('click', function() {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientationabsolute', handleOrientationAbsolute, true);
                                window.addEventListener('deviceorientation', handleOrientation, true);
                                requestBtn.style.display = 'none';
                                statusEl.textContent = 'Waiting for sensor data...';
                            } else {
                                statusEl.textContent = 'Permission denied';
                                statusEl.className = 'status-error';
                            }
                        })
                        .catch(err => {
                            statusEl.textContent = 'Error: ' + err.message;
                            statusEl.className = 'status-error';
                        });
                });
            } else {
                window.addEventListener('deviceorientationabsolute', handleOrientationAbsolute, true);
                window.addEventListener('deviceorientation', handleOrientation, true);
                statusEl.textContent = 'Waiting for sensor data...';
            }
        }

        initCompass();
    </script>
</body>
</html>
