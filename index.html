<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Compass</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        #heading {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
        }
        
        #direction {
            font-size: 24px;
            color: #666;
            margin: 20px 0;
            font-weight: 500;
        }
        
        #debug {
            font-size: 11px;
            color: #999;
            margin-top: 15px;
            font-family: 'Courier New', monospace;
            text-align: left;
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            max-height: 150px;
            overflow-y: auto;
        }
        
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .status-waiting {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        
        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: none;
        }
        
        button:active {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Compass 9:46</h1>
        <div id="heading">---</div>
        <div id="direction">---</div>
        <div id="debug"></div>
        <div id="status" class="status-waiting">Initializing compass...</div>
        <button id="requestBtn">Enable Compass</button>
    </div>

    <script>
        const headingEl = document.getElementById('heading');
        const directionEl = document.getElementById('direction');
        const statusEl = document.getElementById('status');
        const debugEl = document.getElementById('debug');
        const requestBtn = document.getElementById('requestBtn');
        
        let isActive = false;
        let smoothedHeading = null;
        const smoothingFactor = 0.3; // Lower = more smoothing

        function getDirection(heading) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            const index = Math.round(heading / 45) % 8;
            return directions[index];
        }

        function smoothHeading(newHeading) {
            if (smoothedHeading === null) {
                smoothedHeading = newHeading;
                return newHeading;
            }
            
            // Handle wraparound (e.g., 359° to 1°)
            let diff = newHeading - smoothedHeading;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            
            smoothedHeading += diff * smoothingFactor;
            if (smoothedHeading < 0) smoothedHeading += 360;
            if (smoothedHeading >= 360) smoothedHeading -= 360;
            
            return smoothedHeading;
        }

        function handleOrientation(e) {
            let rawAlpha = e.alpha;
            let rawBeta = e.beta;
            let rawGamma = e.gamma;
            
            // Build debug info
            let debugInfo = `Event: ${e.type}<br>`;
            debugInfo += `absolute: ${e.absolute}<br>`;
            debugInfo += `alpha: ${rawAlpha !== null ? rawAlpha.toFixed(1) : 'null'}<br>`;
            debugInfo += `beta: ${rawBeta !== null ? rawBeta.toFixed(1) : 'null'}<br>`;
            debugInfo += `gamma: ${rawGamma !== null ? rawGamma.toFixed(1) : 'null'}<br>`;
            debugInfo += `webkitHeading: ${e.webkitCompassHeading !== undefined ? e.webkitCompassHeading.toFixed(1) : 'N/A'}`;
            
            let heading = null;
            let method = '';
            
            if (e.webkitCompassHeading !== undefined) {
                // iOS devices - this is the true compass heading
                heading = e.webkitCompassHeading;
                method = 'iOS';
            } else if (e.absolute && rawAlpha !== null) {
                // Absolute orientation - should be true compass heading
                heading = rawAlpha;
                method = 'Absolute';
            } else if (rawAlpha !== null) {
                // Relative orientation - alpha decreases clockwise, so invert it
                // This makes heading increase clockwise as expected
                heading = 360 - rawAlpha;
                if (heading >= 360) heading -= 360;
                method = 'Relative (inverted)';
            }
            
            if (heading !== null) {
                const smoothed = smoothHeading(heading);
                
                debugInfo += `<br>---<br>Raw heading: ${heading.toFixed(1)}°<br>`;
                debugInfo += `Smoothed: ${smoothed.toFixed(1)}°<br>`;
                debugInfo += `Method: ${method}`;
                
                headingEl.textContent = Math.round(smoothed) + '°';
                directionEl.textContent = getDirection(smoothed);
                
                if (!isActive) {
                    isActive = true;
                    statusEl.textContent = `Compass active (${method})`;
                    statusEl.className = 'status-active';
                }
            }
            
            debugEl.innerHTML = debugInfo;
        }

        function initCompass() {
            if (typeof DeviceOrientationEvent !== 'undefined') {
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    requestBtn.style.display = 'block';
                    statusEl.textContent = 'Permission required - tap button below';
                    statusEl.className = 'status-waiting';
                    
                    requestBtn.addEventListener('click', function() {
                        DeviceOrientationEvent.requestPermission()
                            .then(response => {
                                if (response === 'granted') {
                                    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                                    window.addEventListener('deviceorientation', handleOrientation, true);
                                    requestBtn.style.display = 'none';
                                    statusEl.textContent = 'Waiting for sensor data...';
                                } else {
                                    statusEl.textContent = 'Permission denied';
                                    statusEl.className = 'status-error';
                                }
                            })
                            .catch(err => {
                                statusEl.textContent = 'Error: ' + err.message;
                                statusEl.className = 'status-error';
                            });
                    });
                } else {
                    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
                    window.addEventListener('deviceorientation', handleOrientation, true);
                    statusEl.textContent = 'Waiting for sensor data...';
                }
            } else {
                statusEl.textContent = 'Device orientation not supported';
                statusEl.className = 'status-error';
            }
        }

        initCompass();
    </script>
</body>
</html>
