<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Compass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the compass needle and gradient background */
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #000000 100%);
        }
        .compass-needle {
            transition: transform 0.1s ease-out; /* Smooth rotation */
            will-change: transform;
        }
        .dial-label {
            position: absolute;
            font-size: 0.8rem;
            font-weight: bold;
            color: #d1d5db;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
        }
        /* Positioning of Cardinal Points */
        .north { top: 0%; left: 50%; transform: translate(-50%, -50%); color: #f87171; }
        .east { top: 50%; right: 0%; transform: translate(50%, -50%); }
        .south { bottom: 0%; left: 50%; transform: translate(-50%, 50%); }
        .west { top: 50%; left: 0%; transform: translate(-50%, -50%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-sm bg-gray-800 p-6 rounded-3xl shadow-2xl text-white">
        
        <h1 class="text-3xl font-extrabold text-center mb-6 text-yellow-300">Mobile Compass - MOnday 5:34</h1>
        <p class="text-center text-sm mb-6 text-gray-400">Heading data can be unstable or require permissions, especially on iOS.</p>

        <!-- Status & Permissions Area -->
        <div id="status-container" class="mb-6 p-4 bg-gray-900 rounded-xl text-center">
            <p id="status-text" class="text-sm font-semibold text-red-400">Awaiting User Action</p>
            <button id="start-button" class="mt-4 px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-full transition duration-300 shadow-lg hover:shadow-xl">
                Start Compass
            </button>
        </div>

        <!-- Heading Display -->
        <div class="text-center mb-6">
            <span id="heading-display" class="text-7xl font-mono font-bold text-green-400">--</span>
            <span class="text-3xl text-gray-500">°</span>
        </div>

        <!-- Compass Visualization -->
        <div class="flex justify-center">
            <div class="relative w-48 h-48 bg-gray-700 border-4 border-gray-600 rounded-full flex items-center justify-center overflow-hidden">
                
                <!-- Cardinal Points -->
                <div class="dial-label north">N</div>
                <div class="dial-label east">E</div>
                <div class="dial-label south">S</div>
                <div class="dial-label west">W</div>

                <!-- Compass Needle SVG (North pointing red, South pointing gray) -->
                <svg id="compass-needle" class="compass-needle w-full h-full" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Red North half -->
                    <path d="M50 5 L55 50 L45 50 Z" fill="#f87171" stroke="#f87171" stroke-width="1"/>
                    <!-- Gray South half -->
                    <path d="M50 95 L55 50 L45 50 Z" fill="#6b7280" stroke="#6b7280" stroke-width="1"/>
                    <!-- Center Pivot -->
                    <circle cx="50" cy="50" r="5" fill="#374151" stroke="#1f2937" stroke-width="1"/>
                </svg>

            </div>
        </div>
    </div>

    <script>
        class CompassController {
            constructor() {
                this.heading = 0;
                this.startButton = document.getElementById('start-button');
                this.statusText = document.getElementById('status-text');
                this.headingDisplay = document.getElementById('heading-display');
                this.compassNeedle = document.getElementById('compass-needle');
                this.eventCounter = 0;

                this.startButton.addEventListener('click', this.startCompass.bind(this));
                
                // Initial check for API support
                if (!window.DeviceOrientationEvent) {
                    this.updateStatus("Error: Device Orientation Not Supported.", 'text-yellow-400', true);
                } else {
                    this.updateStatus("Ready. Tap to start.", 'text-indigo-400', false);
                }
            }

            updateStatus(message, colorClass, disableButton) {
                this.statusText.textContent = message;
                this.statusText.className = 'text-sm font-semibold ' + colorClass;
                this.startButton.disabled = disableButton;
            }

            // Function to handle the actual device orientation event
            handleOrientation(event) {
                let currentHeading = null;
                let referenceType = "N/A";
                
                this.eventCounter++;

                // --- CRITICAL CROSS-BROWSER LOGIC ---

                // 1. Priority 1: Check for iOS-specific WebKit property (most direct)
                if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
                    currentHeading = event.webkitCompassHeading;
                    referenceType = "WebKit";
                } 
                // 2. Priority 2: Check standard alpha value and its absolute flag
                else if (event.absolute === true && event.alpha !== null) {
                    // Alpha is usually counter-clockwise from North, so we use 360 - alpha
                    currentHeading = 360 - event.alpha;
                    referenceType = "Standard Absolute (Alpha)";
                } 
                // 3. Fallback: Use Alpha even if absolute is false or undefined (DANGEROUS: may be relative)
                else if (event.alpha !== null) {
                    // This is a last resort and often yields "game-based" relative rotation.
                    currentHeading = 360 - event.alpha;
                    referenceType = "Relative Alpha (Check Console)";
                }

                if (currentHeading !== null) {
                    this.heading = (currentHeading + 360) % 360; 
                    
                    // Update UI
                    this.headingDisplay.textContent = Math.round(this.heading);
                    this.compassNeedle.style.transform = `rotate(${-this.heading}deg)`;

                    // Update status on first successful read
                    if (this.eventCounter === 1) {
                        this.updateStatus(`Compass Active (${referenceType}). Try moving your device.`, 'text-green-400', true);
                        this.startButton.style.display = 'none';
                    }

                    // Optional: Log raw data to help debug why a heading might be null/stuck
                    console.log(`[Event ${this.eventCounter} - ${referenceType}] Heading: ${Math.round(this.heading)} | Alpha: ${event.alpha} | Absolute: ${event.absolute} | WebKit: ${event.webkitCompassHeading}`);

                } else {
                     // Only update status if the event is firing but data is missing
                     if (this.eventCounter === 1) {
                         this.updateStatus("Data is null/undefined. Try moving the device.", 'text-yellow-400', true);
                     }
                     console.error(`[Event ${this.eventCounter}] Event fired, but heading data is missing. Alpha: ${event.alpha}, Absolute: ${event.absolute}, WebKit: ${event.webkitCompassHeading}`);
                }
            }

            async startCompass() {
                this.updateStatus("Requesting permissions...", 'text-yellow-400', true);

                let permissionGranted = false;
                const eventToListen = 'deviceorientation'; // Using standard event name

                // 1. Handle permissions required by iOS 13+ (Safari)
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    try {
                        const state = await DeviceOrientationEvent.requestPermission();
                        if (state === 'granted') {
                            permissionGranted = true;
                        } else {
                            this.updateStatus("Permission denied. Cannot access sensors.", 'text-red-400', false);
                            return;
                        }
                    } catch (error) {
                         this.updateStatus(`Permission error (${error.name}).`, 'text-red-400', false);
                         return;
                    }
                } else {
                    // 2. Assume permissions not required (e.g., Android/Chrome) or already granted
                    permissionGranted = true;
                }

                if (permissionGranted) {
                    this.updateStatus(`Listening for '${eventToListen}' data...`, 'text-yellow-400', true);
                    
                    // 3. Set up the event listener for the standard event
                    window.addEventListener(eventToListen, this.handleOrientation.bind(this));
                    
                    // Note: The first data point often only arrives after the user moves the device.
                    // If you are on a desktop, this will never move. If on mobile, try moving the phone!
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new CompassController();
        });

    </script>
</body>
</html>
