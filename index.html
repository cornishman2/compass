<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Compass</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
    .container { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center; max-width: 400px; width: 100%; }
    h1 { color: #333; margin-bottom: 30px; font-size: 28px; }
    #heading { font-size: 72px; font-weight: bold; color: #667eea; margin: 20px 0; font-family: 'Courier New', monospace; }
    #direction { font-size: 24px; color: #666; margin: 20px 0; font-weight: 500; }
    #debug { font-size: 11px; color: #999; margin-top: 15px; font-family: 'Courier New', monospace; text-align: left; background: #f5f5f5; padding: 10px; border-radius: 5px; max-height: 200px; overflow-y: auto; }
    #status { margin-top: 20px; padding: 15px; border-radius: 10px; font-size: 14px; }
    .status-waiting { background: #fff3cd; color: #856404; }
    .status-active { background: #d4edda; color: #155724; }
    .status-error { background: #f8d7da; color: #721c24; }
    button { margin-top: 20px; padding: 12px 30px; font-size: 16px; background: #667eea; color: white; border: none; border-radius: 10px; cursor: pointer; }
    button:active { background: #5568d3; }
    #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 5px; display: none; z-index: 100; }
    #arrow { font-size: 40px; margin: 20px auto; transition: transform 0.2s ease; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 Compass 22:40</h1>
    <div id="heading">---</div>
    <div id="direction">Point phone to target</div>
    <div id="arrow">↑</div>
    <div id="debug"></div>
    <div id="status" class="status-waiting">Initializing compass...</div>
    <button id="requestBtn" style="display:none;">Enable Compass</button>
  </div>
  <div id="toast"></div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const STORAGE_KEY = "metal_finder_v5_data";
      const toast = document.getElementById("toast");
      const headingEl = document.getElementById("heading");
      const arrowEl = document.getElementById("arrow");
      const statusEl = document.getElementById("status");

      let smoothedHeading = 0;
      let headingSamples = [];
      let orientationActive = false;
      const DECLINATION_DEG = -2; 
      const HEADING_SMOOTH = 6;

      function uid(p = "id") { return p + Math.random().toString(36).slice(2, 9); }
      function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { return {}; } }
      function save(noToast) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); if (!noToast) showToast("💾 Saved"); }
      function showToast(msg) { 
        if (!toast) return; 
        toast.textContent = msg; 
        toast.style.display = "block"; 
        clearTimeout(toast._t); 
        toast._t = setTimeout(() => { toast.style.display = "none"; }, 2000); 
      }

      function getScreenRotationDeg() {
        if (window.orientation === 90 || window.orientation === -90) return 90; 
        if (window.orientation === -90) return 270;
        return 0; 
      }

      function handleOrientation(e) {
        let heading = null;
        if (typeof e.webkitCompassHeading === "number") {
          heading = e.webkitCompassHeading; 
        } else if (typeof e.alpha === "number") {
          const rot = getScreenRotationDeg();
          heading = (360 - ((e.alpha + rot) % 360)) % 360; 
        }
        if (heading === null || isNaN(heading)) {
          orientationActive = false;
          statusEl.className = "status-error";
          statusEl.textContent = "Compass error. Move phone in a figure-8.";
          return;
        }
        orientationActive = true;
        heading = (heading + DECLINATION_DEG + 360) % 360;
        headingSamples.push(heading);
        if (headingSamples.length > HEADING_SMOOTH) headingSamples.shift();
        let x = 0, y = 0;
        for (const h of headingSamples) {
          const r = (h * Math.PI) / 180;
          x += Math.cos(r);
          y += Math.sin(r);
        }
        smoothedHeading = (Math.atan2(y, x) * 180) / Math.PI;
        smoothedHeading = (smoothedHeading + 360) % 360;
        if (headingEl) headingEl.textContent = Math.round(smoothedHeading) + "°";
        if (arrowEl) arrowEl.style.transform = `rotate(${smoothedHeading}deg)`;
        statusEl.className = "status-active";
        statusEl.textContent = "Compass active. Point at target.";
      }
    
      let targetBearing = null;
      let targetName = "Target";
      let gpsPosition = null;
      let directionEl =  document.getElementById("direction");
                        

      function updateDirection() {
        if (!orientationActive || targetBearing === null || smoothedHeading === null) {
          if (statusEl) statusEl.textContent = "Waiting for compass & target...";
          return;
        }

        const relativeBearing = (targetBearing - smoothedHeading + 360) % 360;
        const dirText = relativeBearing < 10 || relativeBearing > 350 
          ? "→ Ahead" 
          : relativeBearing < 180 
          ? `→ ${Math.round(relativeBearing)}° Right` 
          : `← ${Math.round(360 - relativeBearing)}° Left`;

        if (directionEl) directionEl.textContent = `To ${targetName}: ${dirText}`;
        if (arrowEl) arrowEl.style.transform = `rotate(${targetBearing}deg)`;
      }

      function setTarget(lat, lng) {
        if (!gpsPosition) {
          showToast("Waiting for GPS position...");
          return;
        }
        targetName = prompt("Name this target:", "Target") || "Target";
        targetBearing = calculateBearing(gpsPosition.lat, gpsPosition.lng, lat, lng);
        showToast(`Target set: ${targetName} (${Math.round(targetBearing)}°)`);
        updateDirection();
      }

      function calculateBearing(lat1, lon1, lat2, lon2) {
        const toRad = (deg) => deg * (Math.PI / 180);
        const lat1r = toRad(lat1), lon1r = toRad(lon1), lat2r = toRad(lat2), lon2r = toRad(lon2);
        const dLon = lon2r - lon1r;
        const y = Math.sin(dLon) * Math.cos(lat2r);
        const x = Math.cos(lat1r) * Math.sin(lat2r) - Math.sin(lat1r) * Math.cos(lat2r) * Math.cos(dLon);
        let brng = Math.atan2(y, x) * (180 / Math.PI);
        brng = (brng + 360) % 360;
        return brng;
      }

      if (window.DeviceOrientationEvent) {
        window.addEventListener("deviceorientation", handleOrientation);
      } else {
        statusEl.className = "status-error";
        statusEl.textContent = "Compass not supported on this device/browser.";
      }

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            gpsPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            if (statusEl) statusEl.textContent = `GPS locked. ${gpsPosition.lat.toFixed(5)}, ${gpsPosition.lng.toFixed(5)}`;
          },
          (err) => {
            showToast(`GPS error: ${err.message}`);
            statusEl.className = "status-error";
            statusEl.textContent = "GPS error. Enable location & reload.";
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      } else {
        showToast("Geolocation not supported.");
      }

      setInterval(() => {
        updateDirection();
      }, 100);

      // UI controls (add buttons in HTML as needed)
      const btnSetTarget = document.createElement("button");
      btnSetTarget.textContent = "Set Target";
      btnSetTarget.onclick = () => {
        const lat = parseFloat(prompt("Target latitude:"));
        const lng = parseFloat(prompt("Target longitude:"));
        if (!isNaN(lat) && !isNaN(lng)) setTarget(lat, lng);
        else showToast("Invalid coordinates.");
      };
      document.querySelector(".container").appendChild(btnSetTarget);

      const btnClearTarget = document.createElement("button");
      btnClearTarget.textContent = "Clear Target";
      btnClearTarget.style.marginLeft = "10px";
      btnClearTarget.onclick = () => {
        targetBearing = null;
        targetName = null;
        if (directionEl) directionEl.textContent = "No target set.";
        showToast("Target cleared.");
      };
      document.querySelector(".container").appendChild(btnClearTarget);

      // Cleanup & permissions note
      window.addEventListener("beforeunload", () => {
        if (orientationActive) {
          // Reminder for mobile users (won't block unload)
          showToast("Keep screen awake for compass stability.");
        }
      });
    });
  </script>
</body>
</html>
