<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Compass</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
    .container { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center; max-width: 400px; width: 100%; }
    h1 { color: #333; margin-bottom: 30px; font-size: 28px; }
    #heading { font-size: 72px; font-weight: bold; color: #667eea; margin: 20px 0; font-family: 'Courier New', monospace; }
    #direction { font-size: 24px; color: #666; margin: 20px 0; font-weight: 500; }
    #debug { font-size: 11px; color: #999; margin-top: 15px; font-family: 'Courier New', monospace; text-align: left; background: #f5f5f5; padding: 10px; border-radius: 5px; max-height: 200px; overflow-y: auto; }
    #status { margin-top: 20px; padding: 15px; border-radius: 10px; font-size: 14px; }
    .status-waiting { background: #fff3cd; color: #856404; }
    .status-active { background: #d4edda; color: #155724; }
    .status-error { background: #f8d7da; color: #721c24; }
    button { margin-top: 20px; padding: 12px 30px; font-size: 16px; background: #667eea; color: white; border: none; border-radius: 10px; cursor: pointer; }
    button:active { background: #5568d3; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 Compass 22:17</h1>
    <div id="heading">---</div>
    <div id="direction">---</div>
    <div id="debug"></div>
    <div id="status" class="status-waiting">Initializing compass...</div>
    <button id="requestBtn" style="display:none;">Enable Compass</button>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const STORAGE_KEY = "metal_finder_v5_data";
      // Elements
      const toast = document.getElementById("toast");
      const screens = {
        home: document.getElementById("screen-home"),
        targets: document.getElementById("screen-targets"),
        compass: document.getElementById("screen-compass"),
        settings: document.getElementById("screen-settings"),
      };
      const navBtns = [...document.querySelectorAll(".nav-item")];
      const surveyListEl = document.getElementById("surveyList");
      const btnNewSurvey = document.getElementById("btnNewSurvey");
      const btnNewSurveyAdd = document.getElementById("btnNewSurveyAdd");
      const btnCloseSurvey = document.getElementById("btnCloseSurvey");
      const targetsListEl = document.getElementById("targetsList");
      const btnAddTarget = document.getElementById("btnAddTarget");
      const btnBatch = document.getElementById("btnBatch");
      const openSurveyNameEl = document.getElementById("openSurveyName");
      const compassTargetName = document.getElementById("compassTargetName");
      const headingEl = document.getElementById("heading");
      const bearingEl = document.getElementById("bearing");
      const bearingTextEl = document.getElementById("bearingText");
      const arrowEl = document.getElementById("arrow");
      const btnFirstTarget = document.getElementById("btnFirstTarget");
      const btnPrevTarget = document.getElementById("btnPrevTarget");
      const btnNextTarget = document.getElementById("btnNextTarget");
      const btnLastTarget = document.getElementById("btnLastTarget");
      const btnMarkFound = document.getElementById("btnMarkFound");
      const gpsText = document.getElementById("gpsText");
      const accText = document.getElementById("accText");
      // State
      let data = load();
      data.surveys = data.surveys || [];
      let currentScreen = "home";
      let selectedTargetId = null;
      let currentLightboxImages = [];
      let currentLightboxIndex = 0;
      let currentLightboxTarget = null;
      let batchInterval = null;
      // Compass state
      const NAV_INTERVAL_MS = 500;
      const HEADING_SMOOTH = 6;
      let lastPosition = null;
      let headingSamples = [];
      let smoothedHeading = 0;
      let orientationActive = false;
      const DECLINATION_DEG = -2; // Update for your location (UK ≈ -2°)
      // Utils
      function uid(p = "id") { return p + Math.random().toString(36).slice(2, 9); }
      function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { return {}; } }
      function save(noToast) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); if (!noToast) showToast("💾 Saved"); }
      function showToast(msg) { if (!toast) return; toast.textContent = msg; toast.style.display = "block"; clearTimeout(toast._t); toast._t = setTimeout(() => { toast.style.display = "none"; }, 2000); }
      function escapeHtml(t) { const d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; }
      // Screen navigation
      function showScreen(name) {
        Object.values(screens).forEach((s) => s?.classList.add("hidden"));
        if (screens[name]) screens[name].classList.remove("hidden");
        navBtns.forEach((b) => b.classList.toggle("active", b.dataset.screen === name));
        currentScreen = name;
        if (name === "home") renderSurveys();
        if (name === "targets") renderTargets();
        if (name === "compass") updateNavImmediate();
      }
      navBtns.forEach((b) => { b.addEventListener("click", () => { const target = b.dataset.screen; if (target) showScreen(target); }); });

      // Survey helpers
      function getOpenSurvey() { return data.surveys.find((s) => s.status === "Open" && !s.archived); }
      function setOnlyOpen(id) { data.surveys.forEach((s) => { if (id && s.id === id) { s.status = "Open"; } else if (s.status === "Open") { s.status = "Closed"; } }); }
      function createSurvey(name) { setOnlyOpen(null); const s = { id: uid("s_"), name: name || "Survey " + new Date().toLocaleString(), createdAt: Date.now(), status: "Open", archived: false, targets: [], }; data.surveys.push(s); save(true); renderSurveys(); return s; }

      // Render surveys
      function renderSurveys() {
        if (!surveyListEl) return;
        surveyListEl.innerHTML = "";
        const open = data.surveys.filter((s) => s.status === "Open" && !s.archived);
        const closed = data.surveys.filter((s) => s.status === "Closed" && !s.archived);
        const archived = data.surveys.filter((s) => s.archived);
        const sortByDate = (arr) => arr.sort((a, b) => b.createdAt - a.createdAt);
        sortByDate(open).forEach((s) => addSurveyItem(s, "open"));
        sortByDate(closed).forEach((s) => addSurveyItem(s));
        if (archived.length) { surveyListEl.innerHTML += '<div class="divider">📦 Archived Surveys</div>'; sortByDate(archived).forEach((s) => addSurveyItem(s, "archived")); }
        if (!data.surveys.length) { surveyListEl.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">No surveys yet. Create one to get started!</div>'; }
      }

      function addSurveyItem(s, cls) {
        const item = document.createElement("div");
        item.className = "survey-item" + (cls ? " " + cls : "");
        let actions = "";
        if (s.archived) {
          actions += '<button class="btn btn-secondary btn-sm" data-action="restore" data-id="' + s.id + '">Restore</button>';
        } else {
          actions += '<button class="btn btn-secondary btn-sm" data-action="view" data-id="' + s.id + '">View</button>';
          if (s.status !== "Open") { actions += '<button class="btn btn-secondary btn-sm" data-action="open" data-id="' + s.id + '">Set Open</button>'; }
          if (s.status === "Open") { actions += '<button class="btn btn-secondary btn-sm" data-action="close" data-id="' + s.id + '">Close</button>'; }
          actions += '<button class="btn btn-secondary btn-sm" data-action="archive" data-id="' + s.id + '">Archive</button>';
          actions += '<button class="btn btn-danger btn-sm" data-action="delete" data-id="' + s.id + '">Delete</button>';
        }
        const statusBadge = s.status === "Open" ? '<span class="badge badge-success">● Open</span>' : '<span class="badge badge-muted">● Closed</span>';
        item.innerHTML = `<div class="item-header"><div><div class="item-title">${escapeHtml(s.name)}</div><div class="item-meta"><span>${new Date(s.createdAt).toLocaleDateString()}</span><span>•</span><span>${s.targets.length} targets</span><span>•</span>${statusBadge}</div></div></div><div class="item-actions">${actions}</div>`;
        surveyListEl.appendChild(item);
      }
    ```
      // Compass & GPS logic
      function handleOrientation(e) {
        let heading = null;
        if (typeof e.webkitCompassHeading === "number") {
          heading = e.webkitCompassHeading; // iOS true north
        } else if (typeof e.alpha === "number") {
          const rot = getScreenRotationDeg();
          heading = (360 - ((e.alpha + rot) % 360)) % 360; // Android/other
        }
        if (heading === null || isNaN(heading)) {
          orientationActive = false;
          return;
        }
        orientationActive = true;
        heading = (heading + DECLINATION_DEG + 360) % 360;
        headingSamples.push(heading);
        if (headingSamples.length > HEADING_SMOOTH) headingSamples.shift();
        let x = 0, y = 0;
        for (const h of headingSamples) {
          const r = (h * Math.PI) / 180;
          x += Math.cos(r);
          y += Math.sin(r);
        }
        smoothedHeading = (Math.atan2(y, x) * 180) / Math.PI;
        smoothedHeading = (smoothedHeading + 360) % 360;
        if (headingEl) headingEl.textContent = Math.round(smoothedHeading);
        updateNavImmediate();
      }

      function getScreenRotationDeg() {
        if (window.orientation === 90 || window.orientation === -90) return 90; // landscape
        if (window.orientation === -90) return 270;
        return 0; // portrait (default)
      }

      function updateNavImmediate() {
        // TO DO: implement compass navigation logic here (bearing calculation, arrow rotation)
        // For now, it just updates the heading display
        if (!orientationActive || !arrowEl) return;
        // Example placeholder: rotate arrow (replace with actual target bearing logic)
        const targetAngle = 0; // Replace with actual target bearing (degrees)
        const rel = (targetAngle - smoothedHeading + 360) % 360;
        arrowEl.style.transform = `rotate(${rel}deg)`;
      }

      // Event listeners (basic placeholders – connect as needed)
      btnNewSurveyAdd?.addEventListener("click", () => {
        const name = prompt("Survey name:");
        if (name) createSurvey(name.trim());
      });

      // Init
      showScreen("home");

      // Compass permission & listeners
      if (window.DeviceOrientationEvent) {
        window.addEventListener("deviceorientation", handleOrientation);
      } else {
        showToast("⚠️ Compass not supported on this device/browser.");
      }

      // Request location if needed (add GPS logic if required)
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            lastPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy };
            if (gpsText) gpsText.textContent = `${lastPosition.lat.toFixed(5)}, ${lastPosition.lng.toFixed(5)}`;
            if (accText) accText.textContent = `±${Math.round(lastPosition.acc)}m`;
          },
          (err) => {
            showToast(`GPS error: ${err.message}`);
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
        );
      } else {
        showToast("⚠️ Geolocation not supported.");
      }
    });
  </script>
</body>
</html>
